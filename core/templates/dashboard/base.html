<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    nav a, nav button { margin-right: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .5rem; text-align: left; }
    th { background: #f3f3f3; }
    .errorlist { color: #b00020; padding-left: 1rem; }
    .btn { display: inline-block; padding: .4rem .8rem; background: #2563eb; color: #fff; text-decoration: none; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'project_list' %}">Projects</a>
    <a href="{% url 'techstack_list' %}">Tech Stacks</a>
    <form method="post" action="{% url 'logout' %}" style="display:inline">
      {% csrf_token %}<button type="submit">Sign out</button>
    </form>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
