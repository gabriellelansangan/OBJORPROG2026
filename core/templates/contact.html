<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
        
        body {
            background-color: #0b0b0c; 
            color: #ffffff;
            font-family: "Jersey 10", sans-serif;
            font-weight: 500;
            font-style: normal;
            padding: 20px 20px;
        }

        h1 {
            font-size: 100px; 
            text-align: center;
            color: #fa6f8d;
            line-height: 0.9;
        }

        p {
            font-size: 40px;
            text-align: center;
        }

        a {
            color: #058ED9;
            text-decoration: none;
            font-size: 40px;
            line-height: 0.9;
            transition: color 0.2s ease-in-out;
            display: inline-block;
            text-align: center;
        }

        a:hover {
            color: #fa6f8d;
            text-decoration: none;
        }

        .contact-panel {
            background-color: transparent;
            border: 2px solid #ffc107;
            border-radius: 16px;
        }

        .contact-panel label {
            color: #ffc107;
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
            text-align: center;
        }

        .contact-panel input,
        .contact-panel textarea {
            background-color: transparent;
            border: 2px solid #ffc107;
            color: #ffffff;
            border-radius: 12px;
            font-size: 22px;
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1 class="mb-4">Get in Touch</h1>

    <div class="row mt-3 g-4">
        <div class="col-md-8 mx-auto">
            <form method="POST" class="contact-panel p-4">
                {% csrf_token %}

                <div>
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" required>
                </div>

                <div>
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" required>
                </div>

                <div>
                    <label for="contact_number">Contact Number:</label>
                    <input type="text" id="contact_number" name="contact_number" placeholder="Enter your contact number" required>
                </div>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="your-email@example.com" required>
                </div>

                <div>
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" placeholder="Enter your address" required>
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type your inquiry here..." required></textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-outline-warning px-5 py-2" style="border-radius: 12px; font-weight: bold; font-size: 24px;">
                        LAUNCH INQUIRY
                    </button>
                </div>

            </form>
        </div>
    </div>

    <br>
    <div class="text-center">
        <a href="{% url 'home' %}">Back to Portfolio</a>
    </div>

</body>
</html>
