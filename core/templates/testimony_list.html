<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Testimonies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
        
        body {
            background-color: #0b0b0c; 
            color: #ffffff;
            font-family: "Jersey 10", sans-serif;
            font-weight: 500;
            font-style: normal;
            padding: 20px 20px;
        }

        h1 {
            font-size: 90px; 
            text-align: center;
            color: #fa6f8d;
            line-height: 0.9;
        }

        p {
            font-size: 40px;
            text-align: center;
        }

        a {
            color: #058ED9;
            text-decoration: none;
            font-size: 50px;
            line-height: 0.9;
            transition: color 0.2s ease-in-out;
            display: inline-block;
            text-align: center;
        }

        a:hover {
            color: #fa6f8d;
            text-decoration: none;
        }

        .contact-panel {
            background-color: transparent;
            border: 2px solid #ffc107;
            border-radius: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .testimony-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        .testimony-item {
            padding: 12px 0;
            border-bottom: 1px dashed #ffc107;
        }

        .testimony-item:last-child {
            border-bottom: none;
        }

        .empty-msg {
            color: #ffc107;
            font-size: 28px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="mb-3">My Testimonies</h1>

    <div class="text-center mb-4">
        <a href="{% url 'create_testimony' %}">+ Launch Your Testimony</a>
    </div>

    <div class="row g-4">
        <div class="col-md-6 mx-auto">
            <div class="contact-panel p-4">
                <ul class="testimony-list">
                    {% for testimony in testimonies %}
                        <li class="testimony-item">
                            <a href="{% url 'testimony_detail' pk=testimony.pk %}">
                                {{ testimony.full_name }}
                            </a>
                        </li>
                    {% empty %}
                        <li class="empty-msg">No launched testimonies submitted yet.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>

    <br>
    <div class="text-center">
        <a href="{% url 'home' %}">Back to Home</a>
    </div>

</body>
</html>
