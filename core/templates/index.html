<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabrielle Lansangan's Portfolio</title>
    <!-- Loading Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Site-wide core design rules */
        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
        body {
            background-color: #1a1921; /* Your deep dark background */
            color: #ffffff;
            font-family: "Jersey 10", sans-serif;
            font-weight: 500;
            font-style: normal;
        }

        h1 {
    font-size: 67px; 
    text-align: center;
}

        /* The Hero/Welcome panel design */
        .welcome-panel {
            background-color: transparent;
            border: 3px solid #ffc107; /* Gold accent border line */
            border-radius: 24px;       /* Smoothly rounded corners */
            padding: 60px 20px;
        }

        /* Project Card Styling */
        .project-card {
            position: relative;
            border: 3px solid #000000;
            border-radius: 16px;       /* Matching rounded corners */
            overflow: hidden;
            height: 300px;
            box-shadow: 6px 6px 0px #000000;
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;         /* Keeps image from stretching */
        }

        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 50% dark shading screen */
            display: flex;
            align-items: flex-end;     /* Pushes text to the bottom */
            padding: 20px;
        }

        .project-title {
            color: #ffffff;
            margin: 0;
            text-size-adjust: 60px;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="container my-5">
        
        <!-- Section 1: Hero Welcome Box -->
        <div class="row mb-5">
            <div class="col-lg-8 mx-auto text-center">
                <div class="welcome-panel">
                    <h1 class="display-5 fw-bold mb-3">Welcome to Gabrielle Lansangan's Portfolio!</h1>
                </div>
            </div>
        </div>

        <!-- Section 2: Projects Grid (Stacked completely underneath) -->
        <div class="row">
            <div class="col-lg-6 mx-auto">
                
                <!-- Project Section Title -->
                <h3 class="mb-4 text-center text-muted text-uppercase tracking-wider">Project Showcases</h3>

                <!-- Project Item 1 -->
                <div class="project-card mb-4">
                    <!-- Replace with your actual project image path later -->
                    <img src="Header [Theme 3_4].jpg" class="project-img" alt="Divider">
                    <div class="project-overlay">
                    </div>
                </div>

                <!-- You can easily add more project cards here and they will stack cleanly -->

            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle (Optional, but good to have) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
