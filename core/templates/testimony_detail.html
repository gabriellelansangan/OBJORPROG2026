<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimony Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
        
        body {
            background-color: #0b0b0c; 
            color: #ffffff;
            font-family: "Jersey 10", sans-serif;
            font-weight: 500;
            font-style: normal;
            padding: 20px 20px;
        }

        h1 {
            font-size: 90px; 
            text-align: center;
            color: #fa6f8d;
            line-height: 0.9;
        }

        p {
            font-size: 35px;
            text-align: center;
        }

        a {
            color: #058ED9;
            text-decoration: none;
            font-size: 35px;
            line-height: 0.9;
            transition: color 0.2s ease-in-out;
            display: inline-block;
            text-align: center;
        }

        a:hover {
            color: #fa6f8d;
            text-decoration: none;
        }

        .contact-panel {
            background-color: transparent;
            border: 2px solid #ffc107;
            border-radius: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .testimony-label {
            color: #ffc107;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .testimony-value {
            font-size: 28px;
            color: #ffffff;
        }

        blockquote {
            font-size: 28px;
            color: #ffffff;
            border-left: 3px solid #ffc107;
            padding-left: 15px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="mb-4">Testimony Details</h1>

    <div class="row g-4">
        <div class="col-md-6 mx-auto">
            <div class="contact-panel p-4">
                <div class="text-center mb-4">
                    <div class="testimony-label">Full Name</div>
                    <div class="testimony-value">{{ testimony.full_name }}</div>
                </div>

                <div class="mb-2">
                    <div class="testimony-label text-center">Feedback</div>
                    <blockquote>
                        "{{ testimony.content }}"
                    </blockquote>
                </div>
            </div>
        </div>
    </div>

    <br>
    <div class="text-center">
        <a href="{% url 'testimony_list' %}">Back to All Launched Testimonies</a>
    </div>

</body>
</html>
