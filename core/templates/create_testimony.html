<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leave a Testimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
        
        body {
            background-color: #0b0b0c; 
            color: #ffffff;
            font-family: "Jersey 10", sans-serif;
            font-weight: 500;
            font-style: normal;
            padding: 20px 20px;
        }

        h1 {
            font-size: 90px; 
            text-align: center;
            color: #fa6f8d;
            line-height: 0.9;
        }

        p {
            font-size: 40px;
            text-align: center;
        }

        a {
            color: #058ED9;
            text-decoration: none;
            font-size: 40px;
            line-height: 0.9;
            transition: color 0.2s ease-in-out;
            display: inline-block;
            text-align: center;
        }

        a:hover {
            color: #fa6f8d;
            text-decoration: none;
        }

        .contact-panel {
            background-color: transparent;
            border: 2px solid #ffc107;
            border-radius: 16px;
        }

        .contact-panel label {
            color: #ffc107;
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .contact-panel input,
        .contact-panel textarea,
        .contact-panel select {
            background-color: transparent;
            border: 2px solid #ffc107;
            color: #ffffff;
            border-radius: 12px;
            font-size: 22px;
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1 class="mb-4">Leave a Testimony</h1>

    <div class="row mt-3 g-4">
        <div class="col-md-8 mx-auto">
            <form method="POST" class="contact-panel p-4">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-outline-warning px-5 py-2" style="border-radius: 12px; font-weight: bold; font-size: 24px;">
                        LAUNCH TESTIMONY
                    </button>
                </div>
            </form>
        </div>
    </div>

    <br>
    <div class="text-center">
        <a href="{% url 'testimony_list' %}">View All Launched Testimonies</a>
    </div>

</body>
</html>
